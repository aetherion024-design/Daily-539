name: Auto Update 539

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週六 21:43 與 22:13 自動執行（避開整點/半點尖峰，並提供雙重補抓保險）
    - cron: '43 13 * * 1-6'
    - cron: '13 14 * * 1-6'
  workflow_dispatch: # 支援隨時手動點按鈕測試

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取得最新程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取最新 539 開獎並重算對獎與推薦
        run: python3 daily539_predictor.py --update --top 7

      - name: 自動儲存並推回 GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          git diff --quiet && git diff --staged --quiet || git commit -m "自動更新 539 開獎與推薦"
          git push
